<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Aboke High School</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/role-data.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">A</div>
        <div>
          <div class="brand-name">Aboke High</div>
          <small>School System</small>
        </div>
      </div>

      <nav class="menu">
        <a href="#" class="nav-item active">Dashboard</a>
        <a href="#" class="nav-item">Students</a>
        <a href="#" class="nav-item">Staff</a>
        <a href="#" class="nav-item">Academics</a>
        <a href="#" class="nav-item">Finance</a>
        <a href="#" class="nav-item">Reports</a>
        <a href="#" class="nav-item">Security</a>
      </nav>

      <div class="sidebar-footer">
        <button id="logoutBtn" class="btn btn-light">Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <h2 id="roleTitle">Loading...</h2>
          <p id="roleSubtitle">Loading...</p>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-primary">New</button>
          <button class="btn btn-secondary">Reports</button>
        </div>
      </header>

      <section id="statsGrid" class="stats-grid"></section>

      <div class="content-grid">
        <section class="panel">
          <div class="panel-header">
            <h3>Role Rights & Permissions</h3>
          </div>
          <ul id="permissionsList" class="permission-list"></ul>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h3>Quick Actions</h3>
          </div>
          <div id="quickActions" class="actions"></div>
        </section>
      </div>

      <div id="tablesContainer"></div>
    </main>
  </div>

  <script src="assets/js/auth.js"></script>
  <script>
    // Check if logged in
    const session = getSession();
    if (!session) {
      window.location.href = 'login.html';
    }

    const role = session.role;
    const data = roleData[role];

    if (!data) {
      logout();
      window.location.href = 'login.html';
    }

    document.getElementById('roleTitle').textContent = data.title;
    document.getElementById('roleSubtitle').textContent = data.subtitle;

    document.getElementById('statsGrid').innerHTML = data.stats.map(stat =>
      `<div class="stat-card" style="border-top: 4px solid ${data.color};">
        <strong>${stat.value}</strong>
        <span>${stat.label}</span>
      </div>`
    ).join('');

    document.getElementById('permissionsList').innerHTML = data.permissions.map(item =>
      `<li>✓ ${item}</li>`
    ).join('');

    document.getElementById('quickActions').innerHTML = data.quickActions.map(action =>
      `<button class="action-btn" style="border-color: ${data.color}; color: ${data.color};">${action}</button>`
    ).join('');

    document.getElementById('tablesContainer').innerHTML = data.tables.map(table =>
      `<section class="panel">
        <div class="panel-header">
          <h3>${table.title}</h3>
        </div>
        <table class="data-table">
          <thead>
            <tr>${table.columns.map(col => `<th>${col}</th>`).join('')}</tr>
          </thead>
          <tbody>
            ${table.rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}
          </tbody>
        </table>
      </section>`
    ).join('');

    document.getElementById('logoutBtn').addEventListener('click', function() {
      logout();
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
